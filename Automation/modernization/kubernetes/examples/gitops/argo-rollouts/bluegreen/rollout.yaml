apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web-api-bluegreen
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: web-api-bluegreen
  template:
    metadata:
      labels:
        app: web-api-bluegreen
    spec:
      containers:
        - name: web-api
          image: registry.example.com/web-api:CHANGEME
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
  strategy:
    blueGreen:
      activeService: web-api-active
      previewService: web-api-preview
      autoPromotionEnabled: false
      previewReplicaCount: 1
      scaleDownDelaySeconds: 60
      prePromotionAnalysis:
        templates:
          - templateName: web-health-ready
        args:
          - name: service-name
            value: web-api-preview
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      postPromotionAnalysis:
        templates:
          - templateName: web-health-ready
          # - templateName: prometheus-success-rate
        args:
          - name: service-name
            value: web-api-active
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
