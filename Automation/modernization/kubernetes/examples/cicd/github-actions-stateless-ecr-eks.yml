# Copy to: .github/workflows/stateless-eks.yml
# Build generic app image, scan, push to ECR, deploy to EKS.

name: stateless-ecr-eks-deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  NAMESPACE: ${{ vars.K8S_NAMESPACE || 'default' }}
  DEPLOYMENT: web-api
  CONTAINER: web-api
  HEALTH_URL: ${{ vars.HEALTH_URL }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" \
            -f Automation/modernization/kubernetes/examples/deploy-stateless-web/Dockerfile \
            Automation/modernization/kubernetes/examples/deploy-stateless-web

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push
        run: docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER }}" --region "${{ env.AWS_REGION }}"

      - name: Apply baseline manifests
        run: |
          kubectl apply -n "${{ env.NAMESPACE }}" -k Automation/modernization/kubernetes/examples/deploy-stateless-web

      - name: Roll out image
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.CONTAINER }}=${{ needs.build-scan-push.outputs.image }} \
            -n "${{ env.NAMESPACE }}"
          kubectl rollout status deployment/${{ env.DEPLOYMENT }} -n "${{ env.NAMESPACE }}" --timeout=180s

      - name: Smoke health check
        if: ${{ env.HEALTH_URL != '' }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ env.HEALTH_URL }}" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1
