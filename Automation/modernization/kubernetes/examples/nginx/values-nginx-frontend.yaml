# Example overrides for ../helm/web-app when image is nginx
replicaCount: 2
image:
  repository: public.ecr.aws/docker/library/nginx
  tag: "1.27-alpine"
service:
  port: 80
  targetPort: 80
probes:
  readiness:
    path: /health/live
  liveness:
    path: /health/live
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
